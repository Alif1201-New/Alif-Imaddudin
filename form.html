<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Login</title>
    <link rel="stylesheet" href="form.css">
            
</head>
<body>
    <div class="container">
        <h2>Form registrasi</h2>
            <form action="link.html" method="get">
            <label>Nama / Username</label>
            <input type="text" required placeholder="Masukkan nama atau username" >

            <label>Password</label>
            <input type="password" required placeholder="Masukkan password" >

            <label>Tanggal Lahir</label>
            <input type="date">

            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" required name="gender" > Laki-laki</label>
                <label><input type="radio" required name="gender" > Perempuan</label>
            </div>

            <label>Email</label>
            <input type="email"  required placeholder="contoh@email.com">

            <label>Nomor Telepon</label>
            <input type="tel" required placeholder="08xxxxxxxxxx" >

            <button type="submit" ><b>Registrasi</b></button>
            </form>
    </div>
</body>
</html>
